        plus:<path d="M12 5.5v13M5.5 12h13"/>
    };
    return <svg className="tab-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true" focusable="false">{shapes[name]}</svg>;
};

function ActionBtn({icon,color,bg,title,onClick}) {
    return (
        <button title={title} onClick={e=>{e.stopPropagation();onClick&&onClick(e)}}
            className="p-1.5 rounded-lg transition-all hover:scale-110"
            style={{color,background:'transparent'}}

}

// ── SmartDropdown ─────────────────────────────────────────────────────────────
function SmartDropdown({value,onChange,options,placeholder,onAddNew,addNewLabel,className=''}) {
    const [open,setOpen]=useState(false);
    const [search,setSearch]=useState('');
    const ref=useRef(null);
    useEffect(()=>{
        const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
        document.addEventListener('mousedown',h);
        return()=>document.removeEventListener('mousedown',h);
    },[]);
    const filtered=options.filter(o=>(typeof o==='string'?o:o.label||o.value||'').toLowerCase().includes(search.toLowerCase()));
    const handleSelect=(opt)=>{onChange(typeof opt==='string'?opt:opt.value);setSearch('');setOpen(false)};
    return (
        <div className={`smart-dropdown ${className}`} ref={ref}>
            <div className="form-input flex items-center justify-between cursor-pointer select-none" style={{padding:'9px 14px'}}
                onClick={()=>{setOpen(!open);setSearch('')}}>
                <span className={value?'text-slate-800':'text-slate-400'} style={{fontSize:14}}>{value||placeholder}</span>
                <SvgIcon name="chevDown" size={16} className="text-slate-400 flex-shrink-0"/>
            </div>
            {open&&(
                <div className="smart-dropdown-list">
                    <div style={{padding:'8px 10px',borderBottom:'1px solid #f1f5f9'}}>
                        <input className="form-input" style={{padding:'6px 10px',fontSize:13}} placeholder="Search..."
                            value={search} onChange={e=>setSearch(e.target.value)}
                            autoFocus={window.innerWidth>=768} onClick={e=>e.stopPropagation()}/>
                    </div>
                    {filtered.length===0&&<div className="smart-dropdown-item" style={{color:'#94a3b8',fontStyle:'italic'}}>No results found</div>}
                    {filtered.map((opt,i)=>{
                        const label=typeof opt==='string'?opt:opt.label||opt.value;
                        return <div key={i} className="smart-dropdown-item" onClick={()=>handleSelect(opt)}>{label}</div>;
                    })}
                    {onAddNew&&(
                        <div className="smart-dropdown-item add-new" onClick={()=>{setOpen(false);onAddNew(search)}}>
                            <SvgIcon name="plus" size={14}/>{addNewLabel||'Add new...'}
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ── CustomerSearchDropdown — local demo search ───────────────────────────
// Searches fictional customers in the temporary demo data.
function CustomerSearchDropdown({value, onSelect, onAddNew, demoStore, className=''}) {
    const [open, setOpen]       = useState(false);
    const [search, setSearch]   = useState('');
    const [results, setResults] = useState([]);
    const [loading, setLoading] = useState(false);
    const ref      = useRef(null);
    const timerRef = useRef(null);

    useEffect(()=>{
        const h=(e)=>{if(ref.current&&!ref.current.contains(e.target))setOpen(false)};
        document.addEventListener('mousedown',h);
        return()=>document.removeEventListener('mousedown',h);
    },[]);

    useEffect(()=>{
        if(!open || !demoStore) return;
        clearTimeout(timerRef.current);
        timerRef.current = setTimeout(async()=>{
            setLoading(true);
            try {
                const data=demoStore.list('repair_orders').filter(r=>r.customer_name?.toLowerCase().includes(search.toLowerCase()));
                const customerMap=(data || []).reduce((map,row)=>{
                    const name=String(row.customer_name||'').trim();
                    const key=name.toLocaleLowerCase();
                    if(name&&!map.has(key))map.set(key,{...row,customer_name:name});
                    return map;
                },new Map());
                const unique=[...customerMap.values()].sort((a,b)=>a.customer_name.localeCompare(b.customer_name));
                setResults(unique);
            } catch {
                setResults([]);
            }
            setLoading(false);
        }, 300);
        return()=>clearTimeout(timerRef.current);
    },[search, open, demoStore]);

    const handleOpen=()=>{ setOpen(true); setSearch(''); setResults([]); };

    const handleSelect=(row)=>{ onSelect(row); setOpen(false); setSearch(''); };

    return (
        <div className={`smart-dropdown ${className}`} ref={ref}>
            <div className="form-input flex items-center justify-between cursor-pointer select-none"
                style={{padding:'9px 14px'}} onClick={handleOpen}>
                <span className={value?'text-slate-800':'text-slate-400'} style={{fontSize:14}}>
                    {value||'Select or search customer name'}
                </span>
                <SvgIcon name="chevDown" size={16} className="text-slate-400 flex-shrink-0"/>
            </div>
            {open&&(
                <div className="smart-dropdown-list">
                    <div style={{padding:'8px 10px',borderBottom:'1px solid #f1f5f9'}}>
                        <input className="form-input" style={{padding:'6px 10px',fontSize:13}}
                            placeholder="Type to search customers..."
                            value={search} autoFocus={window.innerWidth>=768}
                            onChange={e=>setSearch(e.target.value)}
                            onClick={e=>e.stopPropagation()}/>
                    </div>
                    {loading&&(
                        <div className="smart-dropdown-item" style={{color:'#94a3b8',justifyContent:'center',gap:6}}>
                            <div style={{width:12,height:12,border:'2px solid #cbd5e1',borderTopColor:'#3b82f6',borderRadius:'50%',animation:'spin 0.7s linear infinite'}}/>
                            Searching…
                        </div>
                    )}
                    {!loading&&results.length===0&&(
                        <div className="smart-dropdown-item" style={{color:'#94a3b8',fontStyle:'italic'}}>
                            {search?'No customers found':'Type to search…'}
                        </div>
                    )}
                    {!loading&&results.map((row,i)=>(
                        <div key={i} className="smart-dropdown-item" onClick={()=>handleSelect(row)}
                            style={{flexDirection:'column',alignItems:'flex-start',gap:1}}>
                            <span style={{fontWeight:600,color:'#1e293b'}}>{row.customer_name}</span>
                            {row.phone&&<span style={{fontSize:12,color:'#94a3b8'}}>{row.phone}</span>}
                        </div>
                    ))}
                    {onAddNew&&(
                        <div className="smart-dropdown-item add-new" onClick={()=>{setOpen(false);onAddNew(search)}}>
                            <SvgIcon name="plus" size={14}/>Add new customer…
                        </div>
                    )}
                </div>
            )}
        </div>
    );
}

// ── Main App ──────────────────────────────────────────────────────────────────
function RepairOrderSystem() {
    const [orders,setOrders]=useState([]);
    const [spareParts,setSpareParts]=useState([]);
    const [showForm,setShowForm]=useState(false);
    const [showSparePartForm,setShowSparePartForm]=useState(false);
    const [editingOrder,setEditingOrder]=useState(null);
    const [editingSparePart,setEditingSparePart]=useState(null);
    const [viewingOrder,setViewingOrder]=useState(null);
    const [viewingImage,setViewingImage]=useState(null);
    const [viewMode,setViewMode]=useState('dashboard');
    const [profile,setProfile]=useState({name:'My Name',bio:'',image:''});
    const [profileDraft,setProfileDraft]=useState({name:'My Name',bio:''});
    const [profileEditing,setProfileEditing]=useState(false);
    const profileImageInput=useRef(null);
    const [profilePhotoBusy,setProfilePhotoBusy]=useState(false);
    const profilePhotoLock=useRef(false);
    const profileRef=useRef(profile);
    profileRef.current=profile;
    useEffect(()=>{
        try {
            const saved=window.DemoStore.profile();
            setProfile(saved);setProfileDraft({name:saved.name,bio:saved.bio});
        } catch(err){setApiError(err.message);}
    },[]);
    const saveProfile=(next)=>{
        try {window.DemoStore.saveProfile(next);setProfile(next);return true;}
        catch(err){setApiError(err.message);return false;}
    };
    const uploadProfilePhoto=async(event)=>{
        const file=event.target.files?.[0];event.target.value='';
        if(!file||profilePhotoLock.current)return;
        profilePhotoLock.current=true;setProfilePhotoBusy(true);setApiError('');
        try {
            const image=await window.ProfileImage.prepare(file);
            saveProfile({...profileRef.current,image});
        } catch(err){setApiError(err.message);}
        finally{profilePhotoLock.current=false;setProfilePhotoBusy(false);}
    };

    const [filteredOrders,setFilteredOrders]=useState([]);
    const [filteredSpareParts,setFilteredSpareParts]=useState([]);
    const [searchTerm,setSearchTerm]=useState('');
    const [sparePartSearchTerm,setSparePartSearchTerm]=useState('');
    const [loading,setLoading]=useState(false);
    const [pendingAction,setPendingAction]=useState('');
    const [apiError,setApiError]=useState('');
    const [stats,setStats]=useState({total:0,inProgress:0,completed:0,revenue:0});
    const [inventoryStats,setInventoryStats]=useState({totalItems:0,lowStock:0,totalValue:0});
    const [revenueData,setRevenueData]=useState({daily:[],monthly:[],yearly:[]});
    const [chartPeriod,setChartPeriod]=useState('monthly');
    const [sidebarHovered,setSidebarHovered]=useState(false);

    // ── NEW: inline update text state for the detail modal ──
    const [updateText,setUpdateText]=useState('');
    const [savingUpdate,setSavingUpdate]=useState(false);

    const chartRef=useRef(null);
    const chartInstance=useRef(null);

    // ── Customer auto-complete store ──────────────────────────────────────────
    // allCustomers: [{customer_name, phone, email}] — used for auto-fill
    const [allCustomers,setAllCustomers]=useState([]);
    const [customerOptions,setCustomerOptions]=useState([]);
    const [phoneOptions,setPhoneOptions]=useState([]);
    const [deviceOptions,setDeviceOptions]=useState([]);


    const toJsonArray = (value) => {
        if (typeof value === 'string') {
            try {
                const parsed = JSON.parse(value);
                return Array.isArray(parsed) ? parsed : [];
            } catch { return []; }
        }
        return Array.isArray(value) ? value : [];
    };

    const normalizeOrder = (row) => ({
        ...row,
        images: toJsonArray(row.images),
        componentsChanged: toJsonArray(row.components_changed),
        updates: toJsonArray(row.updates)
    });

    const normalizeSparePart = (row) => ({ ...row });

    const generateOrderNumber=async()=>window.DemoStore.nextOrderNumber();

    const orderFormDataInitial={
        customerName:'',phone:'',email:'',device:'',issue:'',
        status:'in-progress',dateReceived:new Date().toISOString().split('T')[0],
        endDate:'',images:[],componentsChanged:[],updates:[]
    };
    const sparePartFormDataInitial={
        partNumber:'',partName:'',description:'',quantity:0,unitPrice:0,
        supplier:'',location:'',minQuantity:5,category:'Other'
    };

    const [formData,setFormData]=useState(orderFormDataInitial);
    const [sparePartFormData,setSparePartFormData]=useState(sparePartFormDataInitial);

    const navItems=[
        {id:'dashboard',label:'Dashboard',icon:'dashboard'},
        {id:'all',label:'All Orders',icon:'orders'},
        {id:'in-progress',label:'In Progress',icon:'progress'},
        {id:'completed',label:'Completed',icon:'check'},
        {id:'revenueChart',label:'Revenue Analytics',icon:'revenue'},
        {id:'inventory',label:'Spare Parts',icon:'package'},
    ];

    // ── Helpers ───────────────────────────────────────────────────────────────
    const buildDropdownsFromOrders=(parsed)=>{
        const customers=[...new Map(parsed.filter(o=>o.customer_name).map(o=>[o.customer_name,{customer_name:o.customer_name,phone:o.phone||'',email:o.email||''}])).values()];
        const names=[...new Set(customers.map(c=>c.customer_name))].sort();
        const phones=[...new Set(parsed.map(o=>o.phone).filter(Boolean))].sort();
        const devices=[...new Set(parsed.map(o=>o.device).filter(Boolean))].sort();
        setAllCustomers(customers);
        setCustomerOptions(names);
        setPhoneOptions(phones);
        setDeviceOptions(devices);
    };

    // ── Customer / Phone selection — auto-fill ────────────────────────────────
    const handleCustomerSelect=(name)=>{
        const match=allCustomers.find(c=>c.customer_name===name);
        setFormData(prev=>({...prev,customerName:name,phone:match?.phone||prev.phone,email:match?.email||prev.email}));
    };

    const handlePhoneSelect=(phone)=>{
        const match=allCustomers.find(c=>c.phone===phone);
        setFormData(prev=>({...prev,phone,customerName:match?.customer_name||prev.customerName,email:match?.email||prev.email}));
    };

    const calculateTotalCost=(components=formData.componentsChanged)=>
        (components||[]).reduce((t,c)=>t+(parseFloat(c.cost)||0),0);

    const calculateTotalInventoryValue=(parts=spareParts)=>
        parts.reduce((t,p)=>t+((parseFloat(p.quantity)||0)*(parseFloat(p.unit_price)||0)),0);

    const generateRevenueData=(orders)=>{
        const now=new Date();
        const completed=orders.filter(o=>o.status==='completed');
        const monthNames=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const daily=Array.from({length:7},(_,i)=>{
            const d=new Date();d.setDate(now.getDate()-6+i);
            const ds=d.toISOString().split('T')[0];
            return{date:d.toLocaleDateString('en-US',{weekday:'short'}),fullDate:ds,
                revenue:completed.filter(o=>o.end_date===ds).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        const monthly=Array.from({length:6},(_,i)=>{
            const d=new Date();d.setMonth(now.getMonth()-5+i);
            const yr=d.getFullYear(),mo=d.getMonth()+1;
            return{date:monthNames[d.getMonth()],monthYear:`${monthNames[d.getMonth()]} ${yr}`,
                revenue:completed.filter(o=>{if(!o.end_date)return false;const od=new Date(o.end_date);return od.getFullYear()===yr&&od.getMonth()+1===mo}).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        const yearly=Array.from({length:3},(_,i)=>{
            const yr=now.getFullYear()-2+i;
            return{date:String(yr),revenue:completed.filter(o=>o.end_date?.startsWith(String(yr))).reduce((t,o)=>t+(o.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0),0)};
        });
        setRevenueData({daily,monthly,yearly});
    };

    const initChart=()=>{
        if(chartInstance.current)chartInstance.current.destroy();
        const ctx=chartRef.current?.getContext('2d');
        if(!ctx)return;
        const data=revenueData[chartPeriod]||[];
        const colors={daily:['#1d4ed8','#1d4ed8'],monthly:['#1d4ed8','#1d4ed8'],yearly:['#1d4ed8','#1d4ed8']};
        const[bg,border]=colors[chartPeriod];
        chartInstance.current=new Chart(ctx,{
            type:'bar',
            plugins:[{
                id:'revenueBarValues',
                afterDatasetsDraw(chart){
                    const {ctx,chartArea}=chart;
                    const bars=chart.getDatasetMeta(0).data;
                    const compact=chart.width<480;
                    const formatter=new Intl.NumberFormat('en',{notation:compact?'compact':'standard',maximumFractionDigits:compact?1:2});
                    const labelWidth=chartArea.width/Math.max(bars.length,1)-4;
                    ctx.save();
                    ctx.font=`500 ${compact?10:12}px "DM Sans", sans-serif`;
                    ctx.fillStyle='#334155';
                    ctx.textAlign='center';
                    ctx.textBaseline='bottom';
                    bars.forEach((bar,i)=>{
                        const value=Number(chart.data.datasets[0].data[i]);
                        if(!Number.isFinite(value))return;
                        ctx.fillText(formatter.format(value),bar.x,bar.y-6,labelWidth);
                    });
                    ctx.restore();
                }
            }],
            data:{labels:data.map(d=>d.date),datasets:[{label:'Revenue (RM)',data:data.map(d=>d.revenue),backgroundColor:bg,borderColor:border,borderWidth:1,borderRadius:6}]},
            options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`RM ${c.parsed.y.toFixed(2)}`}}},
                scales:{y:{beginAtZero:true,grace:'15%',border:{display:false},grid:{color:'#e5e7eb',drawTicks:false},ticks:{color:'#334155',maxTicksLimit:5,padding:8,callback:v=>new Intl.NumberFormat('en',{notation:'compact',maximumFractionDigits:1}).format(v).toLowerCase()},title:{display:false}},x:{grid:{display:false},ticks:{color:'#334155'}}}}
        });
    };

    // ── Parse orders helper ───────────────────────────────────────────────────
    const parseOrders=(rawList)=>rawList.map(o=>{
        const p={...o};
        ['images','componentsChanged','updates'].forEach(k=>{
            if(typeof p[k]==='string'){try{p[k]=JSON.parse(p[k])}catch{p[k]=[]}}
            if(!p[k])p[k]=[];
        });
        return p;
    });

    // ── API calls ─────────────────────────────────────────────────────────────
    const fetchOrders=async()=>{
        setLoading(true);setApiError('');
        try {
            const parsed=window.DemoStore.list('repair_orders').map(normalizeOrder);
            setOrders(parsed);generateRevenueData(parsed);buildDropdownsFromOrders(parsed);
        } catch(err) {setApiError(err.message);} finally {setLoading(false);}
    };
    const fetchCustomers=async()=>{};
    const fetchSpareParts=async()=>{
        try {
            const parts=window.DemoStore.list('spare_parts').sort((a,b)=>a.part_name.localeCompare(b.part_name));
            setSpareParts(parts);setInventoryStats({totalItems:parts.length,
                lowStock:parts.filter(p=>Number(p.quantity)<=Number(p.min_quantity)).length,
                totalValue:calculateTotalInventoryValue(parts)});
        } catch(err) {setApiError(err.message);}
    };
    const fetchStats=async()=>{
        try {
            const rows=window.DemoStore.list('repair_orders');
            setStats({total:rows.length,inProgress:rows.filter(r=>r.status==='in-progress').length,
                completed:rows.filter(r=>r.status==='completed').length,
                revenue:rows.filter(r=>r.status==='completed').reduce((sum,r)=>sum+Number(r.estimated_cost),0)});
        } catch(err) {setApiError(err.message);}
    };
    const resetDemo=()=>{
        if(!confirm('Reset all demo orders, parts, profile and images to the sample data?'))return;
        try {window.DemoStore.reset();window.location.reload();}catch(err){setApiError(err.message);}
    };

    const filterOrders=(list=orders,mode=viewMode,term=searchTerm)=>{
        let f=list;
        if(mode==='in-progress')f=f.filter(o=>o.status==='in-progress');
        else if(mode==='completed')f=f.filter(o=>o.status==='completed');
        if(term&&!['dashboard','revenueChart','inventory'].includes(mode)){
            f=f.filter(o=>o.customer_name?.toLowerCase().includes(term.toLowerCase())||o.device?.toLowerCase().includes(term.toLowerCase())||o.order_number?.toLowerCase().includes(term.toLowerCase()));
        }
        setFilteredOrders(f);
    };

    const filterSpareParts=(term=sparePartSearchTerm)=>{
        if(!term){setFilteredSpareParts(spareParts);return}
        setFilteredSpareParts(spareParts.filter(p=>
            p.part_number?.toLowerCase().includes(term.toLowerCase())||
            p.part_name?.toLowerCase().includes(term.toLowerCase())||
            p.description?.toLowerCase().includes(term.toLowerCase())||
            p.category?.toLowerCase().includes(term.toLowerCase())
        ));
    };

    useEffect(()=>{fetchOrders();fetchStats();fetchSpareParts();fetchCustomers();},[]);
    useEffect(()=>{if(viewMode==='revenueChart'&&revenueData[chartPeriod]?.length)initChart();},[viewMode,chartPeriod,revenueData]);
    useEffect(()=>{filterOrders(orders,viewMode,searchTerm);},[viewMode,searchTerm,orders]);
    useEffect(()=>{filterSpareParts(sparePartSearchTerm);},[sparePartSearchTerm,spareParts]);

    const handleNav=(mode)=>{
        setViewMode(mode);
        if(!['revenueChart','inventory','dashboard'].includes(mode))fetchOrders(mode==='all'?'':mode);
        window.scrollTo({top:0,behavior:'instant'});
    };

    const saveOrder=async(data,isEdit)=>{
        setApiError('');
        setPendingAction(isEdit?'Updating order…':'Creating order…');
        try{

            const safeImages = sanitizeImagesForSave(data.images || []);
            const payload = {
                customer_name: data.customerName || '',
                phone: data.phone || '',
                email: data.email || '',
                device: data.device || '',
                issue: data.issue || '',
                estimated_cost: Number(data.estimatedCost || 0),
                status: data.endDate ? 'completed' : (data.status || 'in-progress'),
                date_received: data.dateReceived || new Date().toISOString().split('T')[0],
                end_date: data.endDate || null,
                images: JSON.stringify(safeImages),
                components_changed: JSON.stringify(data.componentsChanged || []),
                updates: JSON.stringify(data.updates || [])
            };

            if ((data.images || []).length > 0 && safeImages.length === 0) {
                setApiError('Some selected images were too large to save. The order was saved without them.');
            }

            window.DemoStore.save('repair_orders',isEdit?{...payload,id:data.id}:{...payload,order_number:await generateOrderNumber()});
            await Promise.all([fetchOrders(),fetchStats(),fetchCustomers()]);
            return { success: true };
        }catch(err){
            console.error(err);
            setApiError(err.message);
            return { success: false, message: 'Failed to save order.' };
        }finally{
            setPendingAction('');
        }
    };

    // ── saveOrderUpdate — optimistic UI update + temporary demo state ──────────
    const saveOrderUpdate=async(orderId,text)=>{
        if(!text?.trim())return{success:false};
        setSavingUpdate(true);
        try {
            const current=window.DemoStore.list('repair_orders').find(o=>o.id===orderId);
            if(!current)throw new Error('Order no longer exists.');
            const updates=[...toJsonArray(current.updates),{text:text.trim(),date:new Date().toISOString(),user:'Demo Technician'}];
            window.DemoStore.save('repair_orders',{...current,updates});
            setViewingOrder(prev=>({...prev,updates}));await fetchOrders();return {success:true};
        } catch(err){setApiError(err.message);return {success:false,message:err.message};}
        finally{setSavingUpdate(false);}
    };

    const saveSparePart=async(data,isEdit)=>{
        setApiError('');
        setPendingAction(isEdit?'Updating spare part…':'Adding spare part…');
        try{

            const payload = {
                part_number: data.partNumber || '',
                part_name: data.partName || '',
                description: data.description || '',
                quantity: Number(data.quantity || 0),
                unit_price: Number(data.unitPrice || 0),
                supplier: data.supplier || '',
                location: data.location || '',
                min_quantity: Number(data.minQuantity ?? 5),
                category: data.category || 'Other'
            };

            window.DemoStore.save('spare_parts',isEdit?{...payload,id:data.id}:{...payload});
            await fetchSpareParts();
            return { success: true };
        }catch(err){
            console.error(err);
            setApiError(err.message);
            return { success: false, message: 'Failed to save spare part.' };
        }finally{
            setPendingAction('');
        }
    };

    const deleteOrder=async(id)=>{
        if(!confirm('Delete this order?'))return;
        setApiError('');
        setPendingAction('Deleting order…');
        try{
            window.DemoStore.remove('repair_orders',id);
            await Promise.all([fetchOrders(),fetchStats()]);
            return true;
        }catch(err){
            console.error(err);
            setApiError('Failed to delete order.');
        }finally{

                                                    <td data-label="Status"><span className="badge text-xs" style={{cssText:statusColor(order.status)}}>{statusLabel(order.status)}</span></td>
                                                    <td data-label="Received" className="text-sm text-slate-500">{order.date_received}</td>
                                                    <td data-label="Completed"><span className={`text-sm font-medium ${order.end_date?'text-emerald-600':'text-slate-300'}`}>{order.end_date||'—'}</span></td>

                            </table>
                        </div>
                    </div>
                </div>
            </div>

    // ── Inventory ─────────────────────────────────────────────────────────────
    const renderInventory=()=>(
        <div>

                <div className="content-toolbar inventory-toolbar">
                    <button className="btn-purple text-sm inventory-add-part" onClick={()=>setShowSparePartForm(true)}><SvgIcon name="plus" size={16}/>Add Part</button>
                </div>
                {apiError&&<div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{apiError}</div>}
                <div className="inventory-summary grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    {[
                        {label:'Total Items',value:inventoryStats.totalItems,icon:'package',color:'#7c3aed',bg:'#ede9fe'},
                        {label:'Low Stock',value:inventoryStats.lowStock,icon:'warn',color:'#d97706',bg:'#fef3c7'},
                        {label:'Total Value',value:`RM ${inventoryStats.totalValue.toFixed(2)}`,icon:'dollar',color:'#059669',bg:'#d1fae5'},
                    ].map((s,i)=>(
                        <div key={i} className="bg-white rounded-2xl border border-slate-200 p-5 flex items-center gap-4">

                            <div><div className="text-xl font-bold text-slate-800">{s.value}</div><div className="text-sm text-slate-500">{s.label}</div></div>

                    ))}

                <div className="bg-white rounded-2xl border border-slate-200 mb-4 p-4 flex items-center gap-4">
                    <div className="search-bar">
                        <SvgIcon name="search" size={16} className="text-slate-400 flex-shrink-0"/>
                        <input placeholder="Search parts..." value={sparePartSearchTerm} onChange={e=>setSparePartSearchTerm(e.target.value)}/>
                    </div>
                    <div className="text-sm text-slate-500 whitespace-nowrap">{filteredSpareParts.length} found</div>
                </div>
                <div className="compact-list mobile-only" aria-label="Spare parts">
                    {filteredSpareParts.length===0?<p className="compact-empty">No parts found. Try another search or add a part.</p>:filteredSpareParts.map(part=>{
                        const min=Number(part.min_quantity??5);
                        const level=part.quantity<=0?'empty':part.quantity<=min?'low':'available';
                        return <details className="compact-part" key={part.id}>
                            <summary>
                                <span className="compact-row-heading"><strong>{part.part_name}</strong><span className="part-quantity">{part.quantity}<small>in stock</small></span></span>
                                <span className="compact-row-footer"><span className={`compact-stock stock-${level}`}>{stockLabel(part.quantity,min)}</span><span>RM {Number(part.unit_price).toFixed(2)} <span className="part-chevron" aria-hidden="true">&#8964;</span></span></span>
                            </summary>
                            <div className="compact-part-details">
                                <dl><div><dt>Part number</dt><dd>{part.part_number}</dd></div><div><dt>Category</dt><dd>{part.category}</dd></div><div><dt>Location</dt><dd>{part.location||'Not set'}</dd></div><div><dt>Supplier</dt><dd>{part.supplier||'Not set'}</dd></div><div><dt>Minimum stock</dt><dd>{min}</dd></div><div><dt>Total value</dt><dd>RM {(Number(part.quantity)*Number(part.unit_price)).toFixed(2)}</dd></div></dl>
                                {part.description&&<p>{part.description}</p>}

                <div className="desktop-only bg-white rounded-2xl border border-slate-200 overflow-hidden">
                    <div className="overflow-x-auto">

                            <tbody>
                                {filteredSpareParts.length===0?(
                                    <tr><td colSpan="7" className="text-center py-16">
                                        <div className="mx-auto w-14 h-14 bg-slate-100 rounded-full flex items-center justify-center mb-3"><SvgIcon name="package" size={24} className="text-slate-400"/></div>
                                        <p className="text-slate-600 font-medium">No parts found</p>
                                    </td></tr>
                                ):(
                                    filteredSpareParts.map(part=>{
                                        const tv=(parseFloat(part.quantity)||0)*(parseFloat(part.unit_price)||0);
                                        const min=parseInt(part.min_quantity??5);
                                        return (
                                            <tr key={part.id}>
                                                <td data-label="Part #"><span className="font-mono text-sm font-bold text-slate-700">{part.part_number}</span></td>
                                                <td data-label="Name"><div className="font-medium text-sm text-slate-800">{part.part_name}</div>{part.description&&<div className="text-xs text-slate-400 truncate max-w-xs">{part.description}</div>}</td>
                                                <td data-label="Category"><span className="badge text-xs bg-slate-100 text-slate-600">{part.category||'Other'}</span></td>
                                                <td data-label="Stock">
                                                    <div className="flex items-center gap-2">
                                                        <span className="badge text-xs" style={{cssText:stockColor(part.quantity,min)}}>{stockLabel(part.quantity,min)}</span>
                                                        <span className="text-sm font-bold text-slate-700">{part.quantity}</span>
                                                        <span className="text-xs text-slate-400">/ min {min}</span>
                                                    </div>
                                                </td>
                                                <td data-label="Unit Price"><span className="font-mono text-sm">RM {parseFloat(part.unit_price).toFixed(2)}</span></td>
                                                <td data-label="Total Value"><span className="font-mono text-sm font-bold text-slate-700">RM {tv.toFixed(2)}</span></td>
                                                <td data-label="Actions">
                                                    <div className="flex items-center gap-1">
                                                        <ActionBtn icon="edit" color="#7c3aed" bg="#ede9fe" title="Edit" onClick={()=>handleEditSparePart(part)}/>
                                                        <ActionBtn icon="trash" color="#dc2626" bg="#fee2e2" title="Delete" onClick={()=>deleteSparePart(part.id)}/>
                                                    </div>
                                                </td>
                                            </tr>
                                        );
                                    })
                                )}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    );

    // ── Revenue Chart ─────────────────────────────────────────────────────────
    const renderRevenueChart=()=>{
        const data=revenueData[chartPeriod]||[];
        const total=data.reduce((s,d)=>s+d.revenue,0);
        const avg=data.length?total/data.length:0;
        const peak=data.length?Math.max(...data.map(d=>d.revenue)):0;
        const completed=orders.filter(o=>o.status==='completed');
        const avgPerOrder=completed.length?total/completed.length:0;
        return (
            <div>
                <div className="p-6">
                    <div className="content-toolbar revenue-toolbar">
                        <label className="revenue-period">Period
                            <select aria-label="Revenue period" className="form-input text-sm" value={chartPeriod} onChange={e=>setChartPeriod(e.target.value)}>
                                <option value="daily">Daily (7 days)</option>
                                <option value="monthly">Monthly (6 months)</option>
                                <option value="yearly">Yearly (3 years)</option>
                            </select>
                        </label>
                        <button className="btn-secondary text-sm" onClick={()=>handleNav('all')}><SvgIcon name="orders" size={16}/>View Orders</button>
                    </div>
                    {apiError&&<div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{apiError}</div>}
                    <div className="revenue-summary grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                        {[
                            {label:'Total Revenue',value:`RM ${total.toFixed(2)}`,icon:'dollar',color:'#2563eb',bg:'#eff6ff'},
                            {label:'Average',value:`RM ${avg.toFixed(2)}`,icon:'trending',color:'#059669',bg:'#d1fae5'},
                            {label:'Peak',value:`RM ${peak.toFixed(2)}`,icon:'chart',color:'#d97706',bg:'#fef3c7'},
                            {label:'Avg per Order',value:`RM ${avgPerOrder.toFixed(2)}`,icon:'dollar',color:'#7c3aed',bg:'#ede9fe'},
                        ].map((s,i)=>(
                            <div key={i} className="bg-white rounded-2xl border border-slate-200 p-5">
                                <div className="flex items-center gap-3 mb-2"><div className="p-2 rounded-lg" style={{background:s.bg}}><SvgIcon name={s.icon} size={18} style={{color:s.color}}/></div></div>
                                <div className="text-xl font-bold text-slate-800"><span className="summary-currency">RM </span>{s.value.replace('RM ','')}</div>
                                <div className="text-sm text-slate-500">{s.label}</div>
                            </div>
                        ))}
                    </div>
                    <div className="revenue-chart bg-white rounded-2xl border border-slate-200 p-6 mb-6">
                        <h3 className="revenue-chart-heading font-bold text-slate-800 mb-4"><span>Revenue Trend</span><span className="revenue-chart-unit">RM</span></h3>
                        <div style={{height:300}}><canvas ref={chartRef}></canvas></div>
                    </div>
                </div>
            </div>
        );
    };

    // ── Order Detail Modal ─────────────────────────────────────────────────────
    // FIXED: inline update input — no prompt(), no stale state
    const renderOrderDetail=()=>{
        if(!viewingOrder)return null;
        const cost=viewingOrder.componentsChanged?.reduce((s,c)=>s+(parseFloat(c.cost)||0),0)||0;

        const handleSendUpdate=async()=>{
            const text=updateText.trim();
            if(!text)return;
            setUpdateText('');
            const result=await saveOrderUpdate(viewingOrder.id,text);
            if(result&&!result.success){
                alert('Failed to save update: '+(result.message||'Unknown error'));
            }
        };

        return (
            <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)setViewingOrder(null)}}>
                <div className="modal-box" style={{maxWidth:800}}>
                    <div className="modal-header flex items-center justify-between">
                        <h2 className="text-xl font-bold text-slate-800">Order #{viewingOrder.order_number}</h2>
                        <button className="p-2 hover:bg-slate-100 rounded-lg" onClick={()=>setViewingOrder(null)}><SvgIcon name="x" size={20} className="text-slate-500"/></button>
                    </div>
                    <div className="modal-body space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Customer</div>
                                <div className="text-base font-bold text-slate-800">{viewingOrder.customer_name}</div>
                                <div className="text-sm text-slate-500 mt-1 flex items-center gap-1"><SvgIcon name="phone" size={13}/>{viewingOrder.phone}</div>
                                {viewingOrder.email&&<div className="text-sm text-slate-500 mt-1">{viewingOrder.email}</div>}
                            </div>
                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Status & Timeline</div>
                                <div className="mb-2"><span className="badge text-xs" style={{cssText:statusColor(viewingOrder.status)}}>{statusLabel(viewingOrder.status)}</span></div>
                                <div className="text-sm text-slate-600">Received: <span className="font-medium text-slate-800">{viewingOrder.date_received}</span></div>
                                <div className={`text-sm mt-1 ${viewingOrder.end_date?'text-emerald-600 font-semibold':'text-slate-400'}`}>Completed: {viewingOrder.end_date||'Not set'}</div>
                            </div>
                        </div>

                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Device & Issue</div>
                            <div className="text-sm font-bold text-slate-800 mb-1">{viewingOrder.device}</div>
                            <div className="text-sm text-slate-600 whitespace-pre-line">{viewingOrder.issue}</div>
                        </div>

                        {/* FIXED: Inline update input — saves correctly and refreshes list */}
                        <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">
                                Updates ({viewingOrder.updates?.length||0})
                            </div>
                            {/* Input row */}
                            <div className="update-input-row">
                                <input
                                    type="text"
                                    placeholder="Type an update and press Send..."
                                    value={updateText}
                                    onChange={e=>setUpdateText(e.target.value)}
                                    onKeyDown={e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSendUpdate()}}}
                                    disabled={savingUpdate}
                                />
                                <button onClick={handleSendUpdate} disabled={savingUpdate||!updateText.trim()}>
                                    {savingUpdate?'Saving…':'Send'}
                                </button>
                            </div>
                            {/* Update history */}
                            {viewingOrder.updates?.length>0?(
                                <div className="space-y-2 mt-3 max-h-48 overflow-y-auto">
                                    {[...viewingOrder.updates].reverse().map((u,i)=>(
                                        <div key={i} className="bg-white rounded-lg p-3 border border-slate-200">
                                            <div className="text-sm text-slate-700">{u.text}</div>
                                            <div className="text-xs text-slate-400 mt-1">{new Date(u.date).toLocaleString()}{u.user&&` · ${u.user}`}</div>
                                        </div>
                                    ))}
                                </div>
                            ):<div className="text-sm text-slate-400 italic mt-3">No updates yet</div>}
                        </div>

                        {viewingOrder.componentsChanged?.length>0&&(
                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Components Changed</div>
                                <div className="space-y-2">
                                    {viewingOrder.componentsChanged.map((c,i)=>(
                                        <div key={i} className="flex items-center justify-between bg-white rounded-lg p-3 border border-slate-200">
                                            <span className="text-sm font-medium text-slate-700">{c.name}</span>
                                            <span className="font-mono text-sm font-bold text-blue-600">RM {parseFloat(c.cost||0).toFixed(2)}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {viewingOrder.images?.length>0&&(
                            <div className="bg-slate-50 rounded-xl p-4 border border-slate-100">
                                <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Device Images ({viewingOrder.images.length})</div>
                                <div className="grid grid-cols-3 gap-2">
                                    {viewingOrder.images.map((img,i)=>{
                                        const src=img.data||img;
                                        return <div key={i} className="aspect-square rounded-lg overflow-hidden border border-slate-200 cursor-pointer hover:border-blue-400 transition-colors" onClick={()=>setViewingImage({data:src,name:img.name||`Image ${i+1}`,all:viewingOrder.images,index:i})}>
                                            <img src={src} alt="" className="w-full h-full object-cover hover:scale-105 transition-transform duration-200" onError={e=>{e.target.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIyMDAiIGZpbGw9IiNGM0Y0RjYiLz48L3N2Zz4='}}/>
                                        </div>;
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 flex items-center justify-between">
                            <div><div className="text-sm font-semibold text-blue-800">Total Cost</div><div className="text-xs text-blue-600">{viewingOrder.componentsChanged?.length||0} component(s)</div></div>
                            <div className="text-2xl font-bold text-blue-700">RM {cost.toFixed(2)}</div>
                        </div>

                        <div className="flex gap-3 pt-2">
                            {/* Invoice available for ALL orders */}
                            <button className="btn-secondary flex-1 justify-center text-sm" style={{background:'#d1fae5',color:'#065f46'}} onClick={()=>generateInvoice(viewingOrder)}>
                                <SvgIcon name="file" size={16}/>Generate Invoice
                            </button>
                            <button className="btn-primary flex-1 justify-center text-sm" onClick={()=>{setViewingOrder(null);handleEdit(viewingOrder);}}>
                                <SvgIcon name="edit" size={16}/>Edit Order
                            </button>
                            <button className="compact-delete" onClick={async()=>{if(await deleteOrder(viewingOrder.id))setViewingOrder(null);}}>Delete Order</button>
                            <button className="btn-secondary flex-1 justify-center text-sm" onClick={()=>setViewingOrder(null)}>Close</button>
                        </div>
                    </div>
                </div>
            </div>
        );
    };

    // ── Order Form ────────────────────────────────────────────────────────────
    const renderOrderForm=()=>{
        if(!showForm)return null;
        return (
            <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)resetOrderForm()}}>

                                <label className="form-label">Email Address</label>
                                <input className="form-input" type="email" placeholder="customer@email.com" value={formData.email} onChange={e=>setFormData(prev=>({...prev,email:e.target.value}))}/>

                            <div>
                                <label className="form-label">Device *</label>
                                <SmartDropdown value={formData.device} onChange={v=>setFormData(prev=>({...prev,device:v}))} options={deviceOptions}

                                <label className="form-label">Status</label>
                                <select className="form-input" value={formData.status} onChange={e=>setFormData(prev=>({...prev,status:e.target.value}))}>

                                    <option value="completed">Completed</option>

                                    <option value="cancelled">Cancelled</option>

                            <div>
                                <label className="form-label">Date Received</label>
                                <input className="form-input" type="date" value={formData.dateReceived} onChange={e=>setFormData(prev=>({...prev,dateReceived:e.target.value}))}/>

                            <div>
                                <label className="form-label">Completion Date</label>
                                <div className="date-input-row">

                                </div>
                                <p className="text-xs text-slate-400 mt-1">Required for revenue tracking</p>

                        </div>

                        <div>
                            <label className="form-label">Issue Description *</label>
                            <textarea className="form-input" rows="3" placeholder="Describe the problem in detail..." value={formData.issue} onChange={e=>setFormData(prev=>({...prev,issue:e.target.value}))}/>
                        </div>

                        <div>
                            <label className="form-label">Device Images</label>
                            <div className="border-2 border-dashed border-slate-200 rounded-xl p-6 text-center hover:border-blue-300 transition-colors">
                                <input type="file" accept="image/*" multiple onChange={handleImageUpload} className="hidden" id="img-upload"/>
                                <label htmlFor="img-upload" className="cursor-pointer">
                                    <div className="mx-auto w-10 h-10 bg-blue-50 rounded-full flex items-center justify-center mb-2"><SvgIcon name="upload" size={20} className="text-blue-500"/></div>
                                    <div className="text-sm text-slate-600 font-medium">Click to upload images</div>
                                    <div className="text-xs text-slate-400 mt-1">PNG, JPG, WebP or GIF / 700 KB each / up to 5 images</div>
                                </label>
                            </div>
                            {formData.images.length>0&&(
                                <div className="grid grid-cols-3 md:grid-cols-5 gap-2 mt-3">
                                    {formData.images.map((img,i)=>(
                                        <div key={i} className="relative group aspect-square">
                                            <img src={getImageSource(img)} alt="" className="w-full h-full object-cover rounded-lg border border-slate-200" onError={e=>{e.target.style.display='none'}}/>
                                            <button onClick={()=>{const imgs=formData.images.filter((_,j)=>j!==i);setFormData(prev=>({...prev,images:imgs}))}}
                                                className="absolute -top-1 -right-1 w-5 h-5 bg-red-500 text-white rounded-full opacity-100 transition-opacity flex items-center justify-center">
                                                <SvgIcon name="x" size={10}/>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div>
                            <div className="flex items-center justify-between mb-3">
                                <label className="form-label mb-0">Components Changed</label>
                                <button className="btn-primary text-xs py-1.5 px-3" onClick={addComponent}><SvgIcon name="plus" size={14}/>Add Component</button>
                            </div>
                            {formData.componentsChanged.length>0&&(
                                <div className="space-y-2">
                                    {formData.componentsChanged.map((c,index)=>(
                                        <div key={c.id??`component-${index}`} className="flex items-center gap-2">
                                            <input className="form-input flex-1" placeholder="Component name" value={c.name??''} onChange={e=>updateComponent(index,'name',e.target.value)}/>
                                            <input className="form-input" style={{width:130}} type="number" step="0.01" placeholder="Cost (RM)" value={c.cost??''} onChange={e=>updateComponent(index,'cost',e.target.value)}/>
                                            <button className="p-2 bg-red-50 text-red-500 rounded-lg hover:bg-red-100 flex-shrink-0" onClick={()=>removeComponent(index)}><SvgIcon name="trash" size={16}/></button>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>

                        <div className="bg-blue-50 rounded-xl p-4 border border-blue-100 flex items-center justify-between">
                            <div><div className="text-sm font-semibold text-blue-800">Total Cost</div><div className="text-xs text-blue-600">{formData.componentsChanged.length} component(s)</div></div>
                            <div className="text-2xl font-bold text-blue-700">RM {calculateTotalCost().toFixed(2)}</div>
                        </div>

                        <div className="flex gap-3 pt-2 border-t border-slate-100">
                            <button className="btn-primary flex-1 justify-center" onClick={handleOrderSubmit}>{editingOrder?'Update Order':'Create Order'}</button>
                            <button className="btn-secondary flex-1 justify-center" onClick={resetOrderForm}>Cancel</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        );
    };

    // ── Spare Part Form ───────────────────────────────────────────────────────
    const renderSparePartForm=()=>{
        if(!showSparePartForm)return null;
        return (
            <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)resetSparePartForm()}}>
                <div className="modal-box" style={{maxWidth:640}}>
                    <div className="modal-header flex items-center justify-between">
                        <h2 className="text-xl font-bold text-slate-800">{editingSparePart?'Edit Spare Part':'Add New Spare Part'}</h2>
                        <button className="p-2 hover:bg-slate-100 rounded-lg" onClick={resetSparePartForm}><SvgIcon name="x" size={20} className="text-slate-500"/></button>
                    </div>
                    <div className="modal-body">
                    {apiError&&<div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm">{apiError}</div>}
                    <div className="space-y-4">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div><label className="form-label">Part Number *</label><input className="form-input" placeholder="e.g., CC-SCREEN-001" value={sparePartFormData.partNumber} onChange={e=>setSparePartFormData(p=>({...p,partNumber:e.target.value}))}/></div>
                            <div><label className="form-label">Part Name *</label><input className="form-input" placeholder="e.g., iPhone 13 Screen" value={sparePartFormData.partName} onChange={e=>setSparePartFormData(p=>({...p,partName:e.target.value}))}/></div>
                            <div><label className="form-label">Category</label>
                                <select className="form-input" value={sparePartFormData.category} onChange={e=>setSparePartFormData(p=>({...p,category:e.target.value}))}>
                                    {['Screen','Battery','Camera','Charging Port','Motherboard','Speaker','Microphone','Other'].map(c=><option key={c}>{c}</option>)}
                                </select>
                            </div>
                            <div><label className="form-label">Location</label><input className="form-input" placeholder="e.g., Shelf A3" value={sparePartFormData.location} onChange={e=>setSparePartFormData(p=>({...p,location:e.target.value}))}/></div>
                            <div><label className="form-label">Quantity</label><input className="form-input" type="number" placeholder="0" value={sparePartFormData.quantity} onChange={e=>setSparePartFormData(p=>({...p,quantity:e.target.value}))}/></div>
                            <div><label className="form-label">Min Quantity</label><input className="form-input" type="number" placeholder="5" value={sparePartFormData.minQuantity} onChange={e=>setSparePartFormData(p=>({...p,minQuantity:e.target.value}))}/></div>
                            <div><label className="form-label">Unit Price (RM)</label><input className="form-input" type="number" step="0.01" placeholder="0.00" value={sparePartFormData.unitPrice} onChange={e=>setSparePartFormData(p=>({...p,unitPrice:e.target.value}))}/></div>
                            <div><label className="form-label">Supplier</label><input className="form-input" placeholder="e.g., TechParts Inc." value={sparePartFormData.supplier} onChange={e=>setSparePartFormData(p=>({...p,supplier:e.target.value}))}/></div>
                        </div>
                        <div><label className="form-label">Description</label><textarea className="form-input" rows="2" placeholder="Additional details..." value={sparePartFormData.description} onChange={e=>setSparePartFormData(p=>({...p,description:e.target.value}))}/></div>
                        <div className="bg-purple-50 rounded-xl p-4 border border-purple-100 flex items-center justify-between">
                            <div><div className="text-sm font-semibold text-purple-800">Total Value</div><div className="text-xs text-purple-600">Qty × Unit Price</div></div>
                            <div className="text-2xl font-bold text-purple-700">RM {((sparePartFormData.quantity||0)*(sparePartFormData.unitPrice||0)).toFixed(2)}</div>
                        </div>
                        <div className="flex gap-3 pt-2 border-t border-slate-100">
                            <button className="btn-purple flex-1 justify-center" onClick={handleSparePartSubmit}>{editingSparePart?'Update Part':'Add Part'}</button>
                            <button className="btn-secondary flex-1 justify-center" onClick={resetSparePartForm}>Cancel</button>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        );
    };

    return (
        <div className={`flex min-h-screen ${pendingAction?'app-busy':''}`} style={{background:'#f5f7fa'}} aria-busy={!!pendingAction}>
            {pendingAction&&<>
                <div className="busy-interaction-lock" aria-hidden="true"/>
                <div className="global-progress" role="progressbar" aria-label={pendingAction}><div className="global-progress-bar"/></div>
                <div className="global-progress-label" role="status" aria-live="polite">{pendingAction}</div>
            </>}
            {renderSidebar()}
            <div className={`main-content flex-1 ${sidebarHovered?'sidebar-expanded':'sidebar-collapsed'}`}>
                <div className="mobile-header sticky top-0 z-30 bg-white border-b border-slate-200 px-4 h-14 items-center justify-between">
                    <button aria-label="Go to Home" className="w-12 h-12 p-0 bg-white/90 hover:bg-white rounded-xl flex items-center justify-center" onClick={()=>handleNav('dashboard')}>
                        <img src="./assets/icons/jobtracker-demo-64.png" alt="" className="w-12 h-12 rounded-xl object-contain"/>
                    </button>
                    <div className="flex items-center justify-center min-w-0 px-1">
                        <span className="font-bold text-slate-800 text-base sm:text-xl whitespace-nowrap">JOBTRACKER DEMO</span>
                    </div>
                    <div className="w-12"/>
                </div>
                {apiError&&<div role="alert" className="demo-error">{apiError}</div>}
                {viewMode==='dashboard'?renderDashboard():viewMode==='revenueChart'?renderRevenueChart():viewMode==='inventory'?renderInventory():renderOrderList()}
            </div>
            <nav className="mobile-tab-bar" aria-label="Mobile navigation">
                {[
                    {id:'dashboard',label:'Home',icon:'dashboard'},
                    {id:'all',label:'Orders',icon:'orders'},
                    {id:'new-order',label:'New Order',icon:'plus'},
                    {id:'inventory',label:'Parts',icon:'package'},
                    {id:'revenueChart',label:'Revenue',icon:'revenue'}
                ].map(item=>{
                    if(item.id==='new-order')return <button key={item.id} className="new-order-tab"
                        aria-haspopup="dialog" onClick={()=>setShowForm(true)}><span className="tab-icon-wrap"><TabIcon name="plus"/></span><span>New Order</span></button>;
                    const active=item.id==='all'?['all','in-progress','completed'].includes(viewMode):viewMode===item.id;
                    return <button key={item.id} className={active?'active':''} aria-current={active?'page':undefined}
                        onClick={()=>handleNav(item.id)}><span className="tab-icon-wrap"><TabIcon name={item.icon}/></span><span>{item.label}</span></button>;
                })}
            </nav>
            {renderOrderForm()}
            {renderSparePartForm()}
            {renderOrderDetail()}
            {viewingImage&&(
                <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-[9999]" onClick={()=>setViewingImage(null)}>
                    <button className="absolute top-4 right-4 p-2 bg-white/20 text-white rounded-full hover:bg-white/30" onClick={()=>setViewingImage(null)}><SvgIcon name="x" size={20}/></button>
                    {viewingImage.all?.length>1&&(
                        <>
                            <button className="absolute left-4 top-1/2 -translate-y-1/2 p-2 bg-white/20 text-white rounded-full hover:bg-white/30 text-xl font-bold"
                                onClick={e=>{e.stopPropagation();const i=(viewingImage.index-1+viewingImage.all.length)%viewingImage.all.length;const img=viewingImage.all[i];setViewingImage({data:getImageSource(img),name:img.name||`Image ${i+1}`,all:viewingImage.all,index:i})}}>&#8249;</button>
                            <button className="absolute right-16 top-1/2 -translate-y-1/2 p-2 bg-white/20 text-white rounded-full hover:bg-white/30 text-xl font-bold"
                                onClick={e=>{e.stopPropagation();const i=(viewingImage.index+1)%viewingImage.all.length;const img=viewingImage.all[i];setViewingImage({data:getImageSource(img),name:img.name||`Image ${i+1}`,all:viewingImage.all,index:i})}}>&#8250;</button>
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 text-white/70 text-sm">{(viewingImage.index||0)+1} / {viewingImage.all.length}</div>
                        </>
                    )}
                    <img src={viewingImage.data||viewingImage} alt="" className="max-w-full max-h-[85vh] object-contain rounded-xl" onClick={e=>e.stopPropagation()}/>
                </div>
            )}
        </div>
    );
}

ReactDOM.render(<RepairOrderSystem/>, document.getElementById('root'));
</script>
</body>
</html>
